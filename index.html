let score=0, done=0, wrongSet=new Set();
const root=document.getElementById('quiz');
const finalBox=document.getElementById('final');

function update(){
  document.getElementById('score').textContent=score;
  document.getElementById('done').textContent=done;
  document.getElementById('percent').textContent=Math.round((score/qs.length)*100)+'%';
  document.getElementById('fill').style.width=(done/qs.length*100)+'%';
  if(done===qs.length){
    finalBox.classList.remove('hidden');
    finalBox.innerHTML = `<h2>النتيجة النهائية</h2><b>${score}/${qs.length}</b> - ${Math.round(score/qs.length*100)}%<br>`+
    (score>=85?'جامد يا ليو 👑🔥':score>=65?'كويس جدًا، راجع الغلط بس 💪':'راجع المحاضرات تاني وامسك الأخطاء 😈');
  }
}
function showWrong(){
  document.querySelectorAll('.card.question').forEach((el,i)=>{
    el.style.display = wrongSet.has(i) ? 'block' : 'none';
  });
}
function showAll(){
  document.querySelectorAll('.card.question').forEach(el=>el.style.display='block');
}
qs.forEach((q,i)=>{
  let d=document.createElement('div');
  d.className='card question';
  d.innerHTML=`<span class="lecture">${q.lec}</span><h3>${i+1}- ${q.q}</h3>`;
  q.o.forEach(op=>{
    let b=document.createElement('div');
    b.className='opt';
    b.textContent=op;
    b.onclick=()=>{
      if(d.dataset.done) return;
      d.dataset.done=1; done++;
      d.querySelectorAll('.opt').forEach(x=>{
        if(x.textContent===q.a) x.classList.add('correct');
      });
      if(op===q.a){
        score++;
        b.classList.add('correct');
      } else {
        b.classList.add('wrong');
        wrongSet.add(i);
      }
      let e=document.createElement('div');
      e.className='explain';
      e.innerHTML=`<b>الإجابة الصحيحة:</b> ${q.a}<br><b>الشرح:</b> ${q.e}`;
      d.appendChild(e);
      update();
    };
    d.appendChild(b);
  });
  root.appendChild(d);
});
update();
</script>
