let typeFilter = 'all';
let lecFilter = 'all';

function setFilter(f){ typeFilter=f; render(); }
function setLec(f){ lecFilter=f; render(); }
function toggleAns(i){
  const el=document.getElementById('ans-'+i);
  el.style.display = el.style.display==='block' ? 'none' : 'block';
}
function showAll(){ document.querySelectorAll('.answer').forEach(e=>e.style.display='block'); }
function hideAll(){ document.querySelectorAll('.answer').forEach(e=>e.style.display='none'); }

function initTabs(){
  const lecs=['all',...new Set(questions.map(q=>q.lec))];
  document.getElementById('lecTabs').innerHTML = lecs.map(l=>`<button onclick="setLec('${l}')">${l==='all'?'كل المحاضرات':l}</button>`).join('');
}

function render(){
  const term=document.getElementById('search').value.trim();
  let arr=questions.filter(q => (typeFilter==='all'||q.type===typeFilter) && (lecFilter==='all'||q.lec===lecFilter));
  if(term) arr=arr.filter(q => (q.q+q.answer+q.ex+q.lec+(q.options||[]).join(' ')).includes(term));
  document.getElementById('list').innerHTML = arr.map((q)=>{
    const globalIndex=questions.indexOf(q);
    const opts = q.type==='tf'
      ? `<button class="opt">صح</button><button class="opt">غلط</button>`
      : q.options.map((o,j)=>`<button class="opt">${['أ','ب','ج','د'][j]}) ${o}</button>`).join('');
    return `<div class="card">
      <div class="meta"><span class="badge">${q.lec}</span><span class="badge">${q.type==='tf'?'صح وغلط':'اختياري'}</span><span class="badge">سؤال ${globalIndex+1}</span></div>
      <div class="q">${q.q}</div>
      <div class="options">${opts}</div>
      <button onclick="toggleAns(${globalIndex})">إظهار الإجابة والشرح</button>
      <div class="answer" id="ans-${globalIndex}">
        <div class="correct">✅ الإجابة الصحيحة: ${q.answer}</div>
        <div class="explain">📖 الشرح: ${q.ex}</div>
      </div>
    </div>`;
  }).join('') || '<div class="card">لا توجد أسئلة مطابقة.</div>';
}
